const state={q:'',category:'Alles',flow:null,step:0};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const normalize=s=>String(s||'').toLocaleLowerCase('nl').trim();
const getFlow=id=>FLOWS.find(f=>f.id===id); const pct=(i,n)=>Math.round(((i+1)/n)*100);
function matchQuery(flow,q){if(!q) return true;if(q.trim()==='op') return [flow.title,flow.subtitle,...flow.steps.flatMap(s=>[s.title,s.body,s.action])].join(' ').toLowerCase().includes('ondersteuningsplan');const corpus=[flow.title,flow.subtitle,flow.tags,flow.category,flow.audience,...flow.steps.flatMap(s=>[s.title,s.body,s.action])].join(' ').toLocaleLowerCase('nl');return q.split(/\s+/).every(term=>!term || corpus.includes(term));}
function getHash(){const h=location.hash.slice(1);if(!h) return {flow:null,step:0};const [flow,step]=h.split('/');return {flow:flow||null,step:Math.max(0,Number(step)||0)};}
function navigate(flow,step=0){location.hash=flow?`#${flow}/${step}`:'';}
function variant(cat){return cat.includes('Wijzigen')?'orange':cat.includes('Overdracht')?'purple':cat.includes('Speciale')?'green':'';}
function ico(t){return t==='home'?'⌂':t==='users'?'👥':t==='edit'?'✎':t==='calendar'?'🗓':t==='repeat'?'↻':t==='file'?'🗎':t==='search'?'⌕':t==='alert'?'!':t==='info'?'i':t==='arrow'?'›':t==='check'?'✓':t==='compass'?'◎':t==='mail'?'✉':t==='eye'?'◉':t==='stop'?'■':t==='scale'?'⚖':t==='building'?'▥':'•';}
function header(detail=false){return `<div class="mast"><div class="shell"><div class="top"><button class="brand plain" data-home="1"><span class="logo">Z</span><span><strong>ZorgNed</strong></span></button></div>${detail?'':`<section class="hero"><label class="searchbox" aria-label="Zoeken"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Zoek een handeling..." value="${esc(state.q)}"><button type="button" data-clear="1">${state.q?'Wissen':'×'}</button></label></section>`}</div></div>`;}
function flowCard(f){return `<button class="flow-card" type="button" data-flow="${esc(f.id)}"><div class="card-top"><span class="icon-tile ${variant(f.category)}">${ico(f.icon)}</span><span class="cat-mini">${esc(f.category)}</span></div><h3>${esc(f.title)}</h3><div class="card-foot"><span>${f.steps.length} stappen</span><span class="arrow-circle">›</span></div></button>`;}
function quickSection(){return `<div class="section-label"><span>Veelgebruikt</span><span class="thin"></span></div><div class="quick">${quickIds.map(id=>{const f=getFlow(id);return `<button type="button" class="quickitem" data-flow="${id}"><span class="qicon">${ico(f.icon)}</span><strong>${esc(f.title)}</strong><small>Openen ›</small></button>`;}).join('')}</div>`;}
function renderHome(){state.flow=null;const q=normalize(state.q);const matched=FLOWS.filter(f=>(state.category==='Alles'||state.category===f.category)&&matchQuery(f,q));app.innerHTML=header(false)+`<main class="main shell"><div class="overview-top"><h2>Handelingen</h2><span class="count" id="resultcount">${matched.length} van ${FLOWS.length} handelingen</span></div><nav class="filters">${categories.map(c=>`<button type="button" class="filter ${c===state.category?'active':''}" data-category="${esc(c)}">${esc(c)}</button>`).join('')}</nav><div id="results">${!q&&state.category==='Alles'?quickSection():''}<div class="section-label"><span>${q?'Resultaten':state.category==='Alles'?'Handelingen':esc(state.category)}</span><span class="thin"></span></div><section class="cards">${matched.length?matched.map(flowCard).join(''):`<div class="empty"><div style="font-size:30px">⌕</div><h3>Geen handeling gevonden</h3><p>Probeer een ander zoekwoord.</p><button class="plainbutton" data-reset="1">Toon alle handelingen</button></div>`}</section></div></main>`;}
function renderResults(){const q=normalize(state.q);const matched=FLOWS.filter(f=>(state.category==='Alles'||state.category===f.category)&&matchQuery(f,q));const el=document.getElementById('results');if(!el) return;el.innerHTML=`${!q&&state.category==='Alles'?quickSection():''}<div class="section-label"><span>${q?'Resultaten':state.category==='Alles'?'Handelingen':esc(state.category)}</span><span class="thin"></span></div><section class="cards">${matched.length?matched.map(flowCard).join(''):`<div class="empty"><div style="font-size:30px">⌕</div><h3>Geen handeling gevonden</h3><p>Probeer een ander zoekwoord.</p><button class="plainbutton" data-reset="1">Toon alle handelingen</button></div>`}</section>`;document.getElementById('resultcount').textContent=`${matched.length} van ${FLOWS.length} handelingen`;}
function uiThumb(kind){const src=UI_THUMBS[kind];const fallback={row:'↗',gear:'⚙',status:'☑',button:'▣',field:'✎',note:'i'}[kind]||'•';return src?`<div class="ui-thumb"><img src="${src}" alt="${kind}"></div>`:`<div class="ui-thumb fallback">${fallback}</div>`;}
function renderUi(step){const items=(step.ui||[]);if(!items.length) return '';return `<div class="block"><div class="block-label">Klik hier</div><div class="ui-list">${items.map(u=>`<div class="ui-item">${uiThumb(u.kind)}<div class="ui-copy"><strong>${esc(u.label)}</strong><p>${esc(u.text)}</p></div></div>`).join('')}</div></div>`;}
function renderVisual(step){
 const ui=step.ui||[];
 const label=step.action||step.title;
 const first=ui.find(x=>['row','gear','status','button'].includes(x.kind));
 const active=first?first.kind:'row';
 const button=ui.find(x=>x.kind==='button');
 return `<section class="visual-panel" aria-label="Voorbeeld in ZorgNed"><div class="visual-mock"><div class="mock-top">Proces</div><div class="mock-row"><span class="mock-open">◯</span><span class="mock-focus ${active==='gear'?'selected':''}"><img class="mock-gear" src="${UI_THUMBS.gear}" alt="Tandwiel"></span><span class="mock-link ${active==='row'?'selected':''}">${esc(label)}</span><span class="mock-status-box ${active==='status'?'selected':''}">Nog doen <span>⌄</span></span></div>${button?`<div class="mock-actions"><span class="mock-action-highlight">${esc(button.label)}</span></div>`:''}</div></section>`;
}
function renderDetail(flow){const step=flow.steps[state.step],n=flow.steps.length,last=state.step===n-1;app.innerHTML=`<div class="mast"><div class="shell"><section class="detailhead"><div class="crumb"><button data-home="1" class="plain">Alle handelingen</button><span>/</span><span>${esc(flow.category)}</span><span>/</span><strong>${esc(flow.title)}</strong></div><div class="inner"><div><h1>${esc(flow.title)}</h1></div><div class="head-buttons"><button type="button" data-copy="1">Kopieer</button></div></div></section></div></div><main class="main shell"><div class="step-layout"><aside class="side"><div class="side-title">Stappen</div><div class="stepnav">${flow.steps.map((v,i)=>`<button type="button" class="side-item" data-step="${i}" ${i===state.step?'aria-current="step"':''}><span class="step-index">${i+1}</span><span>${esc(v.title)}</span></button>`).join('')}</div><div class="side-foot">Werkboek p. ${esc(flow.pages)}</div></aside><section class="stepcontent"><div class="progressline"><span>Stap <strong>${state.step+1} van ${n}</strong></span><span>${pct(state.step,n)}% van deze route</span></div><div class="track"><div style="width:${pct(state.step,n)}%"></div></div>${renderVisual(step)}<article class="step-panel"><div class="step-badge">◎ Stap ${String(state.step+1).padStart(2,'0')}</div><h2>${esc(step.title)}</h2><p class="stepdesc">${esc(step.body)}</p>${step.where&&step.where.length?`<div class="block"><div class="block-label">Locatie</div><div class="bread">${step.where.map((w,i)=>`${i?'<span class="chev">›</span>':''}<span class="crumbchip">${esc(w)}</span>`).join('')}</div></div>`:''}${step.action?`<div class="actionline"><div style="font-size:20px">✓</div><div><strong>Belangrijkste stap / regel</strong><span>${esc(step.action)}</span></div></div>`:''}${renderUi(step)}${step.note?`<div class="block"><div class="block-label">Let op</div><div>${esc(step.note)}</div></div>`:''}<div class="sourcefooter"><span>Werkboek · p. ${step.page}</span></div></article><div class="navfoot"><div><button class="btn" data-prev="1" ${state.step===0?'disabled':''}>Vorige</button></div><div>${last?`<button class="btn primary" data-home="1">Afronden</button>`:`<button class="btn primary" data-next="1">Volgende stap</button>`}</div></div>${last?`<div class="finish-panel"><h3>Route afgerond</h3></div>`:''}${flow.flag?`<div class="block"><div class="block-label">Let op bij deze route</div><div>${esc(flow.flag)}</div></div>`:''}${flow.related&&flow.related.length?`<div class="related"><h3>Ook handig bij deze taak</h3><div class="relatedbuttons">${flow.related.map(id=>{const g=getFlow(id);return g?`<button data-flow="${esc(g.id)}">${esc(g.title)} ›</button>`:'';}).join('')}</div></div>`:''}</section></div></main>`;const active=app.querySelector('.side-item[aria-current]');if(active) active.scrollIntoView({block:'nearest'});}
function render(){const current=state.flow?getFlow(state.flow):null;current?renderDetail(current):renderHome();}
window.addEventListener('hashchange',()=>{const v=getHash();state.flow=v.flow;state.step=v.step;render();window.scrollTo({top:0,behavior:'smooth'});});
document.addEventListener('click',async e=>{const b=e.target.closest('button,a[data-home]');if(!b) return;if(b.dataset.flow){navigate(b.dataset.flow,0);return;}if(b.dataset.home){e.preventDefault();navigate(null);return;}if(b.dataset.step!=null){navigate(state.flow,Number(b.dataset.step));return;}if(b.dataset.prev){navigate(state.flow,state.step-1);return;}if(b.dataset.next){navigate(state.flow,state.step+1);return;}if(b.dataset.category){state.category=b.dataset.category;renderHome();return;}if(b.dataset.clear){state.q='';const inp=document.getElementById('search');if(inp) inp.value='';renderResults();inp&&inp.focus();return;}if(b.dataset.reset){state.q='';state.category='Alles';renderHome();return;}if(b.dataset.copy){const f=getFlow(state.flow);const line=`${f.title} — stap ${state.step+1}/${f.steps.length}: ${f.steps[state.step].title} (Werkafsprakenboek ZorgNed 2.0, p. ${f.steps[state.step].page})`;try{await navigator.clipboard.writeText(line);b.textContent='Verwijzing gekopieerd';}catch{window.prompt('Kopieer deze verwijzing:',line);}return;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.q=e.target.value;const clear=document.querySelector('[data-clear]');if(clear) clear.textContent=state.q?'Wissen':'/';renderResults();}});
document.addEventListener('keydown',e=>{const input=e.target.closest('input,textarea,[contenteditable]');if(e.key==='/'&&!input&&!state.flow){e.preventDefault();document.getElementById('search')&&document.getElementById('search').focus();return;}if(e.key==='Escape'&&input&&e.target.id==='search'){state.q='';e.target.value='';renderResults();e.target.blur();return;}if(!input&&state.flow&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const f=getFlow(state.flow);const next=state.step+(e.key==='ArrowRight'?1:-1);if(next>=0&&next<f.steps.length){e.preventDefault();navigate(state.flow,next);}}});
const v=getHash();state.flow=v.flow;state.step=v.step;render();
</script>
</body>
</html>
